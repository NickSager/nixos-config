# Each tier has one route per provider. A child always stays on its parent's provider;
# when the parent's provider is not listed, the child inherits the parent model unchanged.

tiers:
  fast:
    anthropic: { model: claude-sonnet-5-5, reasoning_effort: low }
    openai-codex: { model: gpt-5.6-terra, reasoning_effort: low }
  judgment:
    anthropic: { model: claude-fable-5.1, reasoning_effort: high }
    openai-codex: { model: gpt-6-astra, reasoning_effort: high }
  instruction:
    anthropic: { model: claude-opus-5-5, reasoning_effort: xhigh }
    openai-codex: { model: gpt-5.6-sol, reasoning_effort: xhigh }

# Upstream pstack skills name Cursor model slugs per role; these map them to tiers.
aliases:
  fast: ["grok-.*", "code", ".*-fast.*"]
  judgment: ["claude-fable-.*", "claude-opus-.*", "opus", "fable"]
  instruction: ["gpt-.*-sol.*", "sol"]
